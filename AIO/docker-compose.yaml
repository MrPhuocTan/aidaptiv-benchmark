# ============================================================================
#  aiDaptiv Benchmark Suite - Docker Compose (AIO)
#  Chạy: docker compose -f AIO/docker-compose.yaml up --build -d
#  (Từ thư mục gốc project)
# ============================================================================

services:

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: aidaptiv-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aidaptiv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aidaptiv2024}
      - POSTGRES_DB=${POSTGRES_DB:-aidaptiv_benchmark}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidaptiv}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aidaptiv-net

  # ---- aiDaptiv Benchmark App ----
  app:
    build:
      context: ..
      dockerfile: AIO/Dockerfile
    image: aidaptiv-benchmark:latest
    container_name: aidaptiv-app
    restart: unless-stopped
    ports:
      - "${AIDAPTIV_APP_PORT:-8443}:8443"
    environment:
      - AIDAPTIV_APP_HOST=0.0.0.0
      - AIDAPTIV_APP_PORT=8443
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-aidaptiv_benchmark}
      - POSTGRES_USER=${POSTGRES_USER:-aidaptiv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aidaptiv2024}
    volumes:
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aidaptiv-net

volumes:
  postgres_data:

networks:
  aidaptiv-net:
    driver: bridge
